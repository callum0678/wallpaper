<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radar Wallpaper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background-color: #020617; overflow: hidden;
        }

        .leaflet-control-container { display: none !important; }
        
        /* Map aesthetics */
        .leaflet-tile-container {
            filter: brightness(0.4) contrast(1.2) saturate(0.2) !important;
        }

        /* Smooth Movement */
        .moving-plane {
            transition: transform 5s linear, left 5s linear, top 5s linear !important;
        }

        .plane-icon {
            color: #60a5fa;
            filter: drop-shadow(0 0 5px #3b82f6);
            transform-origin: center;
            transition: transform 1s ease-in-out; 
        }

        /* Heartbeat indicator so you know it's working */
        #status {
            position: absolute; bottom: 10px; right: 10px;
            width: 8px; height: 8px; background: #3b82f6;
            border-radius: 50%; z-index: 1000;
            box-shadow: 0 0 10px #3b82f6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Setup Map
        const map = L.map('map', {
            center: [54.5, -3.0], 
            zoom: 10,
            zoomControl: false,
            dragging: true, // Enabled for troubleshooting, but Lively will block it anyway
            attributionControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd'
        }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            pane: 'shadowPane' 
        }).addTo(map);

        // 2. Geolocation Fix
        async function setLocalView() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.latitude && data.longitude) {
                    map.setView([data.latitude, data.longitude], 10);
                    // Force a map refresh
                    map.invalidateSize();
                }
            } catch (e) { console.error("Geo-detect failed"); }
        }
        setLocalView();

        // 3. Aircraft Logic
        const API_URL = "https://api.adsb.lol/v2/lat/54.5/lon/-4.5/dist/650";
        const PROXY_URL = "https://corsproxy.io/?"; 
        let aircraftLayer = L.layerGroup().addTo(map);
        let markers = {}; 

        async function scanRadar() {
            try {
                // We use a timestamp to bypass browser caching
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(API_URL)}&nocache=${Date.now()}`);
                const data = await response.json();
                
                if (data && data.ac) {
                    const currentHexes = new Set(data.ac.map(p => p.hex));

                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            const rotation = (plane.track || 0);
                            const planeSvg = `
                                <svg class="plane-icon" style="transform: rotate(${rotation}deg)" viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M21,16L22,13L15,10V3.5A1.5,1.5 0 0,0 13.5,2A1.5,1.5 0 0,0 12,3.5V10L5,13L6,16L12,14V18.5L10,20V22L13.5,21L17,22V20L15,18.5V14L21,16Z" />
                                </svg>`;

                            if (markers[plane.hex]) {
                                const el = markers[plane.hex].getElement();
                                if (el && !el.classList.contains('moving-plane')) el.classList.add('moving-plane');
                                markers[plane.hex].setLatLng([plane.lat, plane.lon]);
                                if (el) {
                                    const svg = el.querySelector('svg');
                                    if (svg) svg.style.transform = `rotate(${rotation}deg)`;
                                }
                            } else {
                                const marker = L.marker([plane.lat, plane.lon], {
                                    icon: L.divIcon({
                                        html: planeSvg,
                                        className: 'plane-div-icon',
                                        iconSize: [24, 24]
                                    })
                                }).addTo(aircraftLayer);
                                markers[plane.hex] = marker;
                            }
                        }
                    });

                    for (let hex in markers) {
                        if (!currentHexes.has(hex)) {
                            aircraftLayer.removeLayer(markers[hex]);
                            delete markers[hex];
                        }
                    }
                }
            } catch (err) { 
                console.warn("Retrying radar sweep..."); 
            }
        }

        // Start the loop
        setInterval(scanRadar, 5000);
        scanRadar();

        // "Wake Up" the map after 2 seconds to ensure Lively Wallpaper is rendering it
        setTimeout(() => {
            map.invalidateSize();
            map.fire('click'); 
        }, 2000);

    </script>
</body>
</html>
