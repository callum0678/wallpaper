<!DOCTYPE html>
<html>
<head>
    <title>UK Radar Wallpaper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { height: 100%; margin: 0; padding: 0; background-color: #020617; }
        /* Hides UI elements for a clean wallpaper look */
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map based on HAR coordinates
        const map = L.map('map', {
            center: [54.5, -4.5],
            zoom: 6.2,
            zoomControl: false,
            attributionControl: false
        });

        // Set the Midnight theme colors found in your styles
        map.getContainer().style.background = '#020617';

        // Using a more reliable CORS proxy (Corsproxy.io) 
        // This targets the specific ADSB.lol endpoint from your logs
        const API_URL = "https://corsproxy.io/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Flat%2F54.5%2Flon%2F-4.5%2Fdist%2F650";

        let aircraftLayer = L.layerGroup().addTo(map);

        async function scanRadar() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                // Clear old markers before drawing new ones
                aircraftLayer.clearLayers();

                if (data.ac) {
                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            L.circleMarker([plane.lat, plane.lon], {
                                radius: 4,
                                color: '#334155', // Slate outline from your HAR data[cite: 1]
                                fillColor: '#60a5fa', // Bright blue for visibility
                                fillOpacity: 0.8,
                                weight: 1
                            }).addTo(aircraftLayer);
                        }
                    });
                }
            } catch (error) {
                console.error("Radar Sync Failed:", error.message);
                // The HAR logs showed massive stalls[cite: 1], 
                // so we catch errors here to keep the app running.
            }
        }

        // Initial scan and refresh every 10 seconds
        scanRadar();
        setInterval(scanRadar, 10000);
    </script>
</body>
</html>
