<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK/IE Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #020617;     /* Background */
            --land-fill: #0f172a;   /* Land color */
            --land-border: #334155; /* Coastline stroke */
            --accent: #38bdf8;      /* Plane color */
        }

        body, html, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
        }

        .leaflet-container { background: var(--bg-deep) !important; }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* The High-Detail Map Outline */
        .strict-map {
            fill: var(--land-fill);
            stroke: var(--land-border);
            stroke-width: 1.5px;
            fill-opacity: 1;
        }

        /* Plane Styling & Pulse */
        .plane-marker {
            filter: drop-shadow(0 0 5px var(--accent));
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        .plane-marker svg {
            animation: pulse 3s infinite ease-in-out;
            transition: all 1s linear;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Setup Map View (Centred and locked)
    const map = L.map('map', {
        zoomControl: false, 
        attributionControl: false,
        dragging: false, 
        scrollWheelZoom: false, 
        zoomSnap: 0.1
    }).setView([54.3, -4.2], 6.3);

    // 2. High-Precision Local Outlines (No Fetch Required)
    const ukMain = [[58.6,-3.1],[58.1,-5.2],[57.5,-5.8],[56.3,-6.2],[55.6,-4.9],[54.9,-5.1],[54.8,-3.1],[54,-3],[53.4,-4.6],[52.8,-4.7],[51.8,-5.3],[50.2,-5.7],[50.1,-3.6],[50.7,-1.3],[51.1,1.3],[51.9,1.6],[52.9,1.7],[53.6,0.1],[54.3,-0.1],[55.2,-1.5],[55.9,-2.1],[57.2,-1.9],[58.6,-3.1]];
    const ireland = [[55.4,-7.3],[55.1,-8.2],[54.3,-10.1],[52.2,-10.4],[51.5,-9.7],[51.4,-8.4],[52.2,-6.2],[53.3,-6],[54.1,-5.9],[55.4,-7.3]];
    const extra = [
        [[54.2,-4.3],[54.4,-4.4],[54.4,-4.5],[54.1,-4.5]], // Isle of Man
        [[49.4,-2.3],[49.5,-2.4],[49.5,-2.5],[49.4,-2.5]]  // Guernsey/Jersey area
    ];

    L.polygon(ukMain, {className: 'strict-map'}).addTo(map);
    L.polygon(ireland, {className: 'strict-map'}).addTo(map);
    extra.forEach(is => L.polygon(is, {className: 'strict-map'}).addTo(map));

    // 3. Plane Data Logic with CORS Proxy
    let aircraft = {};

    async function scanRadar() {
        try {
            // Using a CORS Proxy to bypass GitHub Pages security restrictions
            const proxy = 'https://api.allorigins.win/raw?url=';
            const targetApi = 'https://api.adsb.lol/v2/lat/54.5/lon/-4.5/dist/650';
            
            const response = await fetch(proxy + encodeURIComponent(targetApi));
            if (!response.ok) throw new Error('Proxy or API error');
            
            const data = await response.json();
            if (!data.ac) return;

            const currentFlightIds = new Set();

            data.ac.forEach(ac => {
                if (!ac.lat || !ac.lon) return;

                const icao = ac.icao;
                currentFlightIds.add(icao);
                
                const track = ac.track || 0;
                const iconHtml = `
                    <div class="plane-marker">
                        <svg viewBox="0 0 24 24" width="18" height="18" style="transform:rotate(${track}deg)">
                            <path fill="#38bdf8" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                        </svg>
                    </div>`;

                if (aircraft[icao]) {
                    // Smoothly slide existing planes
                    aircraft[icao].setLatLng([ac.lat, ac.lon]);
                    // Update rotation only if marker exists
                    aircraft[icao].setIcon(L.divIcon({ html: iconHtml, className: '', iconSize: [18, 18] }));
                } else {
                    // Create new plane marker
                    aircraft[icao] = L.marker([ac.lat, ac.lon], {
                        icon: L.divIcon({ html: iconHtml, className: '', iconSize: [18, 18] })
                    }).addTo(map);
                }
            });

            // Remove planes that are no longer in range
            Object.keys(aircraft).forEach(icao => {
                if (!currentFlightIds.has(icao)) {
                    map.removeLayer(aircraft[icao]);
                    delete aircraft[icao];
                }
            });

        } catch (err) {
            console.log("Radar sweep encounterd a delay. Retrying...");
        }
    }

    // Refresh every 12 seconds for a balance of live-data and rate-limit safety
    setInterval(scanRadar, 12000);
    scanRadar();
</script>
</body>
</html>
