<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK/IE Radar Wallpaper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #020617;
            --land-fill: #0f172a;
            --land-border: #334155;
            --accent: #38bdf8;
        }

        body, html, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
        }

        .leaflet-container { background: var(--bg-deep) !important; }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* The Strict Map Outline */
        .map-path {
            fill: var(--land-fill);
            stroke: var(--land-border);
            stroke-width: 1.5px;
            fill-opacity: 1;
        }

        /* Plane Radar Pulse */
        .plane-marker {
            filter: drop-shadow(0 0 5px var(--accent));
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        .plane-marker svg {
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize radar view
    const map = L.map('map', {
        zoomControl: false, attributionControl: false,
        dragging: false, scrollWheelZoom: false, zoomSnap: 0.1
    }).setView([54.5, -4.5], 6.2);

    // Strict coastline polygons
    const uk = [[58.6,-3.1],[58.1,-5.2],[57.5,-5.8],[56.3,-6.2],[55.6,-4.9],[54.9,-5.1],[54.8,-3.1],[54,-3],[53.4,-4.6],[52.8,-4.7],[51.8,-5.3],[50.2,-5.7],[50.1,-3.6],[50.7,-1.3],[51.1,1.3],[51.9,1.6],[52.9,1.7],[53.6,0.1],[54.3,-0.1],[55.2,-1.5],[55.9,-2.1],[57.2,-1.9],[58.6,-3.1]];
    const ie = [[55.4,-7.3],[55.1,-8.2],[54.3,-10.1],[52.2,-10.4],[51.5,-9.7],[51.4,-8.4],[52.2,-6.2],[53.3,-6],[54.1,-5.9],[55.4,-7.3]];
    
    L.polygon(uk, {className: 'map-path'}).addTo(map);
    L.polygon(ie, {className: 'map-path'}).addTo(map);

    let planes = {};

    async function refreshAirspace() {
        try {
            // ADSB.lol is a more open alternative to OpenSky
            // This endpoint fetches all planes in a 1000km radius of the UK center
            const response = await fetch('https://api.adsb.lol/v2/lat/54.5/lon/-4.5/dist/600');
            const data = await response.json();
            
            if (!data.ac) return;

            const activeIds = new Set();

            data.ac.forEach(aircraft => {
                // ac is the array of aircraft
                const id = aircraft.icao;
                const lat = aircraft.lat;
                const lon = aircraft.lon;
                const track = aircraft.track || 0;

                if (lat && lon) {
                    activeIds.add(id);
                    const iconHtml = `
                        <div class="plane-marker">
                            <svg viewBox="0 0 24 24" width="18" height="18" style="transform:rotate(${track}deg)">
                                <path fill="#38bdf8" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                            </svg>
                        </div>`;

                    if (planes[id]) {
                        planes[id].setLatLng([lat, lon]);
                        // Only update icon if track changed significantly to save CPU
                        planes[id].setIcon(L.divIcon({ html: iconHtml, className: '', iconSize: [18, 18] }));
                    } else {
                        planes[id] = L.marker([lat, lon], {
                            icon: L.divIcon({ html: iconHtml, className: '', iconSize: [18, 18] })
                        }).addTo(map);
                    }
                }
            });

            // Remove old planes
            for (let id in planes) {
                if (!activeIds.has(id)) {
                    map.removeLayer(planes[id]);
                    delete planes[id];
                }
            }
        } catch (err) {
            console.log("Radar scan in progress...");
        }
    }

    // ADSB.lol allows faster updates. Setting to 10 seconds.
    setInterval(refreshAirspace, 10000);
    refreshAirspace();
</script>
</body>
</html>
