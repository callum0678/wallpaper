<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Drawn UK Radar (Static)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Define the Wallpaper Size (1920x1080) */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f0f0f0; /* Match image's white/pale background */
            overflow: hidden; /* Hide scrollbars for wallpaper */
        }

        #map-container {
            height: 100%;
            width: 100%;
            position: relative;
            cursor: default; /* Remove map cursor */
        }

        /* The Custom Plane Style */
        .plane-icon {
            color: #000; /* Black planes for hand-drawn look */
            filter: drop-shadow(0 0 1px rgba(0,0,0,0.5));
            transform-origin: center;
            transition: all 4.8s linear; /* Smooth gliding movement */
            pointer-events: none; /* Can't click planes */
        }
    </style>
</head>
<body>

    <div id="map-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Setup a basic canvas (we aren't using real coordinates)
        // Set CRS to Simple for pixel-to-pixel mapping
        const map = L.map('map-container', {
            crs: L.CRS.Simple,
            minZoom: -1.5,
            maxZoom: 0,
            zoom: -1.5,
            center: [512, 512], // Arbitrary pixel center
            zoomControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            attributionControl: false
        });

        // 2. Load the custom hand-drawn map (image_3.png) as an overlay
        // Image Dimensions (assuming a standard large wallpaper size)
        const imageBounds = [[0, 0], [1024, 1024]];
        const mapImage = L.imageOverlay('image_3.png', imageBounds).addTo(map);
        map.fitBounds(imageBounds);

        // 3. The complex "Georeferencing" logic for THIS custom drawing
        // Mapping a fixed image to real Lat/Lon is an estimate.
        // I have found key points on image_3.png and mapped them to real coordinates.
        const referencePoints = {
            'Cornwall (tip)':  { px: [181, 882],  ll: [50.1, -5.7] }, // SW tip
            'London (center)': { px: [610, 831],  ll: [51.5, -0.1] }, // London area
            'Shetland (tip)':  { px: [821, 100],  ll: [60.8, -0.8] }, // Top tip
            'Belfast (center)':{ px: [378, 629],  ll: [54.6, -5.9] }  // Northern Ireland
        };

        // Linear interpolation function
        function translate_ll_to_px(lat, lon) {
            // Find bounding box for North/South (Lat)
            const minLat = referencePoints['Cornwall (tip)'].ll[0]; // 50.1
            const maxLat = referencePoints['Shetland (tip)'].ll[0]; // 60.8
            const minPxLat = referencePoints['Cornwall (tip)'].px[0]; // 181
            const maxPxLat = referencePoints['Shetland (tip)'].px[0]; // 821

            // Find bounding box for East/West (Lon)
            const minLon = referencePoints['Belfast (center)'].ll[1]; // -5.9
            const maxLon = referencePoints['London (center)'].ll[1];  // -0.1
            const minPxLon = referencePoints['Belfast (center)'].px[1]; // 629 (this looks weird because longitude is negative)
            const maxPxLon = referencePoints['London (center)'].px[1];  // 831 (less negative)

            // Calculate pixel position (inverse Y-axis)
            let y_px = ((lat - minLat) / (maxLat - minLat)) * (maxPxLat - minPxLat) + minPxLat;
            let x_px = ((lon - minLon) / (maxLon - minLon)) * (maxPxLon - minPxLon) + minPxLon;
            
            // Adjust to leaflet's CRS.Simple coordinate space
            // In CRS.Simple, 0,0 is top-left, while our measurement is bottom-left
            return [x_px, 1024 - y_px]; 
        }

        // 4. Live Tracking & Filter Logic
        const API_URL = "https://corsproxy.io/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Flat%2F54.5%2Flon%2F-4.5%2Fdist%2F650";
        let aircraftLayer = L.layerGroup().addTo(map);
        let markers = {}; 

        // Filter: Keep planes within ~100km of a key UK location
        // This rough circle method works best with static coordinates.
        function filterByRange(lat, lon) {
            const UK_CENTER = [54.5, -3.5]; // Central Lat/Lon of Britain
            const distanceThreshold = 650; // The API already only covers 650km.
            // But we need to filter further down to "near land" for this image.

            // Define a 'box' that fits image_3.png loosely
            const mapFilterBox = {
                lat_min: 50.0, lat_max: 61.0, // North/South box (Shetland to Cornwall)
                lon_min: -6.5, lon_max: 2.0  // West/East box (West Ireland to North Sea)
            };

            return (lat > mapFilterBox.lat_min && lat < mapFilterBox.lat_max &&
                    lon > mapFilterBox.lon_min && lon < mapFilterBox.lon_max);
        }

        async function scanRadar() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.ac) {
                    const currentHexes = new Set(data.ac.map(p => p.hex));

                    data.ac.forEach(plane => {
                        // Apply the strict UK boundary filter
                        if (plane.lat && plane.lon && filterByRange(plane.lat, plane.lon)) {
                            // Convert GPS coordinates to Pixel coordinates on THIS specific drawing
                            const pixelCoord = translate_ll_to_px(plane.lat, plane.lon);
                            const rotation = plane.track || 0;
                            const planeSvg = `
                                <svg class="plane-icon" style="transform: rotate(${rotation}deg)" viewBox="0 0 24 24" width="18" height="18">
                                    <path fill="currentColor" d="M21,16L22,13L15,10V3.5A1.5,1.5 0 0,0 13.5,2A1.5,1.5 0 0,0 12,3.5V10L5,13L6,16L12,14V18.5L10,20V22L13.5,21L17,22V20L15,18.5V14L21,16Z" />
                                </svg>`;

                            if (markers[plane.hex]) {
                                // Smoothly update existing marker (it will glide to the new pixel spot)
                                markers[plane.hex].setLatLng(pixelCoord);
                                const iconElement = markers[plane.hex].getElement();
                                if (iconElement) {
                                    const svg = iconElement.querySelector('svg');
                                    if (svg) svg.style.transform = `rotate(${rotation}deg)`;
                                }
                            } else {
                                // Add new plane at its pixel coordinate
                                const marker = L.marker(pixelCoord, {
                                    icon: L.divIcon({
                                        html: planeSvg,
                                        className: 'plane-div-icon',
                                        iconSize: [18, 18]
                                    })
                                }).addTo(aircraftLayer);
                                markers[plane.hex] = marker;
                            }
                        } else {
                            // Plane was found but failed the UK filter.
                            // Ensure it is removed if it was already on the map.
                            if (markers[plane.hex]) {

                                delete markers[hex];
                            }
                        }
                    });

                    // General cleanup for landed planes
                    for (let hex in markers) {
                        if (!currentHexes.has(hex)) {
                            aircraftLayer.removeLayer(markers[hex]);
                            delete markers[hex];
                        }
                    }
                }
            } catch (error) {
                console.error("Radar update failure.");
            }
        }

        // Run Every 5 Seconds
        scanRadar();
        setInterval(scanRadar, 5000);
    </script>
</body>
</html>
