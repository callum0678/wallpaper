<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Live Airspace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            /* Clean, Professional Palette */
            --bg-color: #0f172a;       /* Deep Slate Blue */
            --land-fill: #1e293b;      /* Slightly lighter Slate */
            --land-stroke: #475569;    /* Crisp Border */
            --plane-color: #00f2ff;    /* Cyan Neon */
        }

        body, html, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* Remove all map UI for a pure wallpaper look */
        .leaflet-container {
            background: var(--bg-color) !important;
            cursor: default !important;
        }

        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }

        /* Plane Styling */
        .plane-icon-svg {
            filter: drop-shadow(0 0 4px var(--plane-color));
            transition: transform 0.8s ease-in-out, top 1s linear, left 1s linear;
        }

        /* Smooth fade-in for the map */
        .leaflet-layer, .leaflet-overlay-pane {
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Setup Map (Strictly fixed for wallpaper use)
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false
    }).setView([54.2, -3.5], 6);

    // 2. High-Precision Outlines
    // This uses a more detailed dataset for the "Strict" look you want
    const ukUrl = 'https://raw.githubusercontent.com/codeforgermany/click_dummy/master/public/data/geo/world/GBR.geo.json';
    const ireUrl = 'https://raw.githubusercontent.com/codeforgermany/click_dummy/master/public/data/geo/world/IRL.geo.json';

    const mapStyle = {
        color: "#475569",     // Border color
        weight: 1.5,          // Crisp line
        fillColor: "#1e293b", // Land color
        fillOpacity: 1
    };

    // Load UK and Ireland strictly
    Promise.all([
        fetch(ukUrl).then(res => res.json()),
        fetch(ireUrl).then(res => res.json())
    ]).then(([ukData, ireData]) => {
        L.geoJSON(ukData, { style: mapStyle }).addTo(map);
        L.geoJSON(ireData, { style: mapStyle }).addTo(map);
    });

    // 3. Live Flight Tracking
    let planeMarkers = {};

    async function updateFlights() {
        try {
            // OpenSky Bounding Box for UK/Ireland
            const response = await fetch('https://opensky-network.org/api/states/all?lamin=49.0&lomin=-11.0&lamax=61.0&lomax=2.0');
            const data = await response.json();
            
            if (!data.states) return;

            const currentIcaos = new Set();

            data.states.forEach(f => {
                const [icao, callsign, country, time, last, lon, lat, alt, ground, vel, track] = f;

                if (lat && lon && !ground) {
                    currentIcaos.add(icao);
                    
                    const rotation = track || 0;
                    const planeHtml = `
                        <svg class="plane-icon-svg" viewBox="0 0 24 24" width="18" height="18" style="transform: rotate(${rotation}deg);">
                            <path fill="#00f2ff" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                        </svg>`;

                    if (planeMarkers[icao]) {
                        planeMarkers[icao].setLatLng([lat, lon]);
                        planeMarkers[icao].setIcon(L.divIcon({ className: '', html: planeHtml, iconSize: [18, 18] }));
                    } else {
                        planeMarkers[icao] = L.marker([lat, lon], {
                            icon: L.divIcon({ className: '', html: planeHtml, iconSize: [18, 18] })
                        }).addTo(map);
                    }
                }
            });

            // Remove planes that have left the area
            for (let icao in planeMarkers) {
                if (!currentIcaos.has(icao)) {
                    map.removeLayer(planeMarkers[icao]);
                    delete planeMarkers[icao];
                }
            }
        } catch (e) {
            console.log("Waiting for API update...");
        }
    }

    // Update every 12 seconds
    setInterval(updateFlights, 12000);
    updateFlights();
</script>

</body>
</html>
