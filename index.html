<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK & Ireland Live Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { 
            height: 100%; 
            width: 100%;
            margin: 0; 
            padding: 0; 
            background-color: #020617; 
            overflow: hidden;
        }

        .leaflet-control-container { display: none !important; }
        
        /* The "Radar" Plane Style */
        .plane-icon {
            color: #60a5fa;
            filter: drop-shadow(0 0 3px #60a5fa);
            transform-origin: center;
            transition: all 4.5s linear;
        }

        .land-outline {
            stroke-dasharray: 2, 2; /* Optional: gives a "radar grid" look to borders */
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map (Centered to show UK and Ireland perfectly)
        const map = L.map('map', {
            center: [54.0, -2.5], 
            zoom: 6,
            zoomControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            attributionControl: false
        });

        // 1. Fetch Reliable Landmass Data
        // Using Natural Earth data via a stable RawGit/GitHub mirror
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    filter: function(feature) {
                        // Filter for UK and Ireland
                        const name = feature.properties.NAME;
                        return name === "United Kingdom" || name === "Ireland";
                    },
                    style: {
                        color: '#334155',    /* Slate Border */
                        weight: 1.5,
                        fillColor: '#0f172a', /* Deep navy land */
                        fillOpacity: 1,
                        className: 'land-outline'
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Map data failed to load:", err));

        // 2. Live Plane Tracking Logic
        const API_URL = "https://corsproxy.io/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Flat%2F54.5%2Flon%2F-4.5%2Fdist%2F650";
        let aircraftLayer = L.layerGroup().addTo(map);
        let markers = {}; 

        async function scanRadar() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) return;
                const data = await response.json();
                
                if (data.ac) {
                    const currentHexes = new Set(data.ac.map(p => p.hex));

                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            const rotation = plane.track || 0;
                            const planeSvg = `
                                <svg class="plane-icon" style="transform: rotate(${rotation}deg)" viewBox="0 0 24 24" width="18" height="18">
                                    <path fill="currentColor" d="M21,16L22,13L15,10V3.5A1.5,1.5 0 0,0 13.5,2A1.5,1.5 0 0,0 12,3.5V10L5,13L6,16L12,14V18.5L10,20V22L13.5,21L17,22V20L15,18.5V14L21,16Z" />
                                </svg>`;

                            if (markers[plane.hex]) {
                                // Update position
                                markers[plane.hex].setLatLng([plane.lat, plane.lon]);
                                // Update rotation
                                const iconElement = markers[plane.hex].getElement();
                                if (iconElement) {
                                    const svg = iconElement.querySelector('svg');
                                    if (svg) svg.style.transform = `rotate(${rotation}deg)`;
                                }
                            } else {
                                // New plane entry
                                const marker = L.marker([plane.lat, plane.lon], {
                                    icon: L.divIcon({
                                        html: planeSvg,
                                        className: 'plane-div-icon',
                                        iconSize: [18, 18]
                                    })
                                }).addTo(aircraftLayer);
                                markers[plane.hex] = marker;
                            }
                        }
                    });

                    // Remove planes that left coverage
                    for (let hex in markers) {
                        if (!currentHexes.has(hex)) {
                            aircraftLayer.removeLayer(markers[hex]);
                            delete markers[hex];
                        }
                    }
                }
            } catch (error) {
                console.log("Waiting for radar update...");
            }
        }

        // Run Every 5 Seconds
        scanRadar();
        setInterval(scanRadar, 5000);
    </script>
</body>
</html>
