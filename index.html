<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Manager</title>
    <!-- Map Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-overlay: rgba(15, 23, 42, 0.4);
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-1: hsl(199, 89%, 60%);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0; padding: 0; background-color: #0f172a;
            color: var(--text-main); font-family: 'Inter', sans-serif;
            height: 100vh; overflow: hidden;
        }

        /* Background & Radar */
        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        
        #radar-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; opacity: 0.7; pointer-events: none; 
            background: transparent !important; 
        }
        .leaflet-container { background: transparent !important; }

        #bg-video, #bg-image {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%); object-fit: cover; display: none;
        }

        #bg-overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-overlay); z-index: 1; }

        /* Plane Icons */
        .plane-icon { color: var(--accent-1); font-size: 18px; filter: drop-shadow(0 0 5px var(--accent-1)); transition: all 1s linear; }
        .plane-label { color: rgba(255,255,255,0.4); font-size: 9px; font-weight: bold; white-space: nowrap; }

        /* Weather UI */
        #weather-display {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; text-align: center; pointer-events: none;
        }
        .weather-emoji { font-size: 4.5rem; display: block; margin-bottom: 5px; }
        .weather-text { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; }
        .weather-temp { color: var(--accent-1); margin-left: 10px; }

        /* Layout */
        #app-container {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            gap: 2rem; padding: 0 5vw; transition: filter 0.3s ease;
            flex-wrap: wrap; position: relative; z-index: 2;
        }

        .exam-card {
            flex: 0 1 350px; background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 24px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 2.5rem 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
            user-select: none; transition: transform 0.05s ease;
        }

        .module-code { font-size: 2.2rem; font-weight: 800; margin: 0; color: var(--accent-1); text-transform: uppercase; }
        .days-remaining { font-size: 7.5rem; font-weight: 900; line-height: 1; margin: 0.5rem 0; }
        .label { font-size: 1rem; color: var(--text-dim); letter-spacing: 2px; }
        .shattered { opacity: 0 !important; pointer-events: none; }

        /* Settings Menu */
        #settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 25, 0.98); backdrop-filter: blur(30px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
        }
        #settings-overlay.open { display: flex; }
        .settings-viewport { width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .settings-section { margin-bottom: 2rem; background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .input-group { display: flex; gap: 10px; margin-bottom: 1rem; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 8px; color: white; flex: 1; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-add { background: var(--accent-1); color: #000; }
        #settings-trigger { position: fixed; bottom: 30px; left: 30px; z-index: 1000; font-size: 1.2rem; background: rgba(255,255,255,0.1); padding: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Shatter Animation */
        .fragment { position: absolute; pointer-events: none; z-index: 3000; animation: shatter-explode 1.5s forwards; font-size: 2.5rem; }
        @keyframes shatter-explode {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--vx), calc(var(--vy) + 1000px)) rotate(var(--tr)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-container">
        <div id="bg-overlay-layer"></div>
        <video id="bg-video" autoplay muted loop playsinline></video>
        <div id="bg-image"></div>
    </div>

    <div id="radar-layer"></div>

    <div id="weather-display">
        <span class="weather-emoji" id="w-emoji">🌤️</span>
        <div class="weather-text">
            <span id="w-desc">FETCHING...</span> <span class="weather-temp" id="w-temp">--°C</span>
        </div>
    </div>

    <div id="app-container"></div>
    <div id="settings-trigger">⚙️</div>

    <div id="settings-overlay">
        <button class="btn" id="exit-btn" style="position:fixed; top:30px; right:40px; background:#fff; color:#000;">CLOSE</button>
        <div class="settings-viewport">
            <div class="settings-section">
                <h2 style="margin-top:0; color:var(--accent-1);">Wallpaper Path</h2>
                <div class="input-group">
                    <input type="text" id="wallpaper-path" placeholder="C:/Path/To/File.jpg or URL">
                    <button class="btn btn-add" id="apply-wallpaper">Save</button>
                </div>
            </div>
            <div class="settings-section">
                <h2 style="margin-top:0; color:var(--accent-1);">Manage Exams</h2>
                <div class="input-group">
                    <input type="text" id="new-code" placeholder="Code">
                    <input type="date" id="new-date">
                    <button class="btn btn-add" id="add-exam">Add</button>
                </div>
                <div id="exam-manage-list"></div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_BG = 'file:///C:/Users/ohare/Downloads/DJI_20250319181026_0022_D.jpg';
        let exams = JSON.parse(localStorage.getItem('exams')) || [{ id: 1, code: 'CSC1033', date: '2026-05-18' }];
        let planeMarkers = {};

        // Setup Radar
        const map = L.map('radar-layer', {
            center: [52.95, -1.15], zoom: 7, zoomControl: false, 
            attributionControl: false, dragging: false, scrollWheelZoom: false
        });

        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
            .then(res => res.json()).then(data => {
                L.geoJSON(data, {
                    filter: (f) => ['United Kingdom', 'Ireland'].includes(f.properties.name),
                    style: { color: 'rgba(255,255,255,0.15)', weight: 1.5, fillOpacity: 0 }
                }).addTo(map);
            });

        async function updateRadarAndWeather() {
            try {
                // Weather
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=52.95&longitude=-1.15&current=temperature_2m,weather_code`);
                const wData = await wRes.json();
                const weatherMap = {
                    0: { desc: 'Clear Sky', emoji: '☀️' },
                    1: { desc: 'Mainly Clear', emoji: '🌤️' },
                    2: { desc: 'Partly Cloudy', emoji: '⛅' },
                    3: { desc: 'Overcast', emoji: '☁️' },
                    61: { desc: 'Rainy', emoji: '🌧️' }
                };
                const status = weatherMap[wData.current.weather_code] || { desc: 'Cloudy', emoji: '☁️' };
                document.getElementById('w-temp').innerText = `${Math.round(wData.current.temperature_2m)}°C`;
                document.getElementById('w-desc').innerText = status.desc;
                document.getElementById('w-emoji').innerText = status.emoji;

                // Planes
                const target = "https://opensky-network.org/api/states/all?lamin=50.0&lamax=56.0&lomin=-5.0&lomax=2.0";
                const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;
                const pRes = await fetch(proxy);
                const pRaw = await pRes.json();
                const pData = JSON.parse(pRaw.contents);

                if (pData.states) {
                    pData.states.slice(0, 30).forEach(s => {
                        const [icao, call, country, time, last, lon, lat, baro, ground, heading] = s;
                        if (lat && lon) {
                            const angle = (heading || 0) - 45;
                            if (planeMarkers[icao]) {
                                planeMarkers[icao].setLatLng([lat, lon]);
                                planeMarkers[icao].getElement().querySelector('.plane-icon').style.transform = `rotate(${angle}deg)`;
                            } else {
                                const icon = L.divIcon({
                                    className: 'p-idx',
                                    html: `<div class="plane-icon" style="transform: rotate(${angle}deg)">✈</div><div class="plane-label">${call||''}</div>`
                                });
                                planeMarkers[icao] = L.marker([lat, lon], { icon }).addTo(map);
                            }
                        }
                    });
                }
            } catch (e) { console.log("Updating data..."); }
        }

        function renderExams() {
            const container = document.getElementById('app-container');
            const manageList = document.getElementById('exam-manage-list');
            container.innerHTML = ''; manageList.innerHTML = '';
            exams.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(exam => {
                const card = document.createElement('div');
                card.className = 'exam-card';
                const days = Math.ceil((new Date(exam.date) - new Date()) / 86400000);
                card.innerHTML = `<h1 class="module-code">${exam.code}</h1><div class="days-remaining">${days <= 0 ? 0 : days}</div><div class="label">DAYS REMAINING</div>`;
                let clicks = 0;
                card.onclick = () => {
                    clicks++;
                    card.style.transform = `scale(0.96) translate(${(Math.random()-0.5)*10}px, ${(Math.random()-0.5)*10}px)`;
                    setTimeout(() => card.style.transform = '', 50);
                    if (clicks >= 10) { clicks = 0; shatter(card); }
                };
                container.appendChild(card);
                const item = document.createElement('div');
                item.style.cssText = "display:flex; justify-content:space-between; padding:12px; background:rgba(255,255,255,0.05); margin-bottom:8px; border-radius:10px;";
                item.innerHTML = `<span>${exam.code}</span><button onclick="deleteExam(${exam.id})" style="color:#ff4444; background:none; border:none; cursor:pointer; font-weight:bold;">DELETE</button>`;
                manageList.appendChild(item);
            });
            localStorage.setItem('exams', JSON.stringify(exams));
        }

        function shatter(card) {
            const rect = card.getBoundingClientRect();
            card.classList.add('shattered');
            for (let i = 0; i < 20; i++) {
                const frag = document.createElement('div');
                frag.className = 'fragment'; frag.innerHTML = '📚';
                frag.style.left = (rect.left + rect.width/2) + 'px';
                frag.style.top = (rect.top + rect.height/2) + 'px';
                frag.style.setProperty('--vx', (Math.random()-0.5)*800 + 'px');
                frag.style.setProperty('--vy', (Math.random()-0.5)*600 - 300 + 'px');
                frag.style.setProperty('--tr', (Math.random()*1500) + 'deg');
                document.body.appendChild(frag);
                setTimeout(() => frag.remove(), 1500);
            }
            setTimeout(() => card.classList.remove('shattered'), 2000);
        }

        function applyBg(path) {
            const v = document.getElementById('bg-video'), i = document.getElementById('bg-image');
            const isVid = /\.(mp4|webm|mov)$/i.test(path);
            if (isVid) { i.style.display='none'; v.style.display='block'; v.src=path; }
            else { v.style.display='none'; i.style.display='block'; i.style.backgroundImage=`url('${path}')`; i.style.backgroundSize='cover'; }
        }

        function deleteExam(id) { exams = exams.filter(e => e.id !== id); renderExams(); }

        document.getElementById('add-exam').onclick = () => {
            const code = document.getElementById('new-code').value, date = document.getElementById('new-date').value;
            if (code && date) { exams.push({ id: Date.now(), code, date }); renderExams(); }
        };

        document.getElementById('settings-trigger').onclick = () => document.getElementById('settings-overlay').classList.add('open');
        document.getElementById('exit-btn').onclick = () => document.getElementById('settings-overlay').classList.remove('open');
        document.getElementById('apply-wallpaper').onclick = () => {
            const p = document.getElementById('wallpaper-path').value;
            localStorage.setItem('custom-wallpaper', p); applyBg(p);
        };

        const savedBg = localStorage.getItem('custom-wallpaper') || DEFAULT_BG;
        document.getElementById('wallpaper-path').value = savedBg;
        applyBg(savedBg);
        renderExams();
        updateRadarAndWeather();
        setInterval(updateRadarAndWeather, 35000);
    </script>
</body>
</html>
