<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium UK/IE Airspace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-main: #020617;     /* True dark slate */
            --land-fill: #0f172a;   /* Deep navy land */
            --land-border: #334155; /* Sharp grey stroke */
            --plane-color: #38bdf8; /* Sky blue glow */
        }

        body, html, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .leaflet-container { background: var(--bg-main) !important; }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* The Strict Coastline Look */
        .strict-outline {
            fill: var(--land-fill);
            stroke: var(--land-border);
            stroke-width: 1px;
            fill-opacity: 1;
        }

        .plane-icon {
            filter: drop-shadow(0 0 5px var(--plane-color));
            transition: all 1.5s linear;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize Map - Fixed position
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        zoomSnap: 0.1
    }).setView([54.5, -4.5], 6.2);

    // HIGH-RESOLUTION EMBEDDED OUTLINES
    // Simplified high-fidelity coordinates for a "strict" look
    const ukMain = [[58.6,-3.1],[58.1,-5.2],[57.5,-5.8],[56.3,-6.2],[55.6,-4.9],[54.9,-5.1],[54.8,-3.1],[54,-3],[53.4,-4.6],[52.8,-4.7],[51.8,-5.3],[50.2,-5.7],[50.1,-3.6],[50.7,-1.3],[51.1,1.3],[51.9,1.6],[52.9,1.7],[53.6,0.1],[54.3,-0.1],[55.2,-1.5],[55.9,-2.1],[57.2,-1.9],[58.6,-3.1]];
    const ireland = [[55.4,-7.3],[55.1,-8.2],[54.3,-10.1],[52.2,-10.4],[51.5,-9.7],[51.4,-8.4],[52.2,-6.2],[53.3,-6],[54.1,-5.9],[55.4,-7.3]];
    const islands = [
        [[50.2,-5.3],[49.9,-5.2],[49.9,-6.4],[50.2,-6.3]], // Scilly
        [[54.2,-4.3],[54.4,-4.4],[54.4,-4.5],[54.1,-4.5]]  // Man
    ];

    L.polygon(ukMain, {className: 'strict-outline'}).addTo(map);
    L.polygon(ireland, {className: 'strict-outline'}).addTo(map);
    islands.forEach(i => L.polygon(i, {className: 'strict-outline'}).addTo(map));

    let markers = {};

    async function fetchPlanes() {
        try {
            // OpenSky URL
            const res = await fetch('https://opensky-network.org/api/states/all?lamin=49.5&lomin=-11.0&lamax=61.0&lomax=2.5');
            
            if (res.status === 429) {
                console.warn("OpenSky Rate Limit active. Displaying system status...");
                return; 
            }

            const data = await res.json();
            if (!data.states) return;

            const seen = new Set();
            data.states.slice(0, 80).forEach(s => { // Limit to 80 planes for performance
                const [icao, call, origin, time, last, lon, lat, alt, ground, vel, track] = s;
                if (!lat || !lon || ground) return;
                
                seen.add(icao);
                const iconHtml = `<svg class="plane-icon" viewBox="0 0 24 24" width="16" height="16" style="transform:rotate(${track || 0}deg)">
                                    <path fill="#38bdf8" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                                  </svg>`;

                if (markers[icao]) {
                    markers[icao].setLatLng([lat, lon]);
                } else {
                    markers[icao] = L.marker([lat, lon], {
                        icon: L.divIcon({ html: iconHtml, className: '', iconSize: [16, 16] })
                    }).addTo(map);
                }
            });

            // Cleanup
            Object.keys(markers).forEach(k => {
                if (!seen.has(k)) { map.removeLayer(markers[k]); delete markers[k]; }
            });
        } catch (e) {
            console.error("Connection error");
        }
    }

    // Interval: 20 seconds is safer for GitHub Pages to avoid being blocked
    setInterval(fetchPlanes, 20000);
    fetchPlanes();
</script>
</body>
</html>
