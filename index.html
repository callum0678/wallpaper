<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radar Wallpaper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background-color: #020617; overflow: hidden;
        }

        .leaflet-control-container { display: none !important; }
        
        /* DARK MAP FILTER: Makes the map look even more 'Radar-like' */
        .leaflet-tile-container {
            filter: brightness(0.6) contrast(1.2) saturate(0.5);
        }

        /* SMOOTH MOVEMENT ENGINE */
        .moving-plane {
            /* 5s duration matches the 5s API refresh */
            transition: transform 5s linear, left 5s linear, top 5s linear !important;
        }

        .plane-icon {
            color: #60a5fa;
            filter: drop-shadow(0 0 5px #3b82f6);
            transform-origin: center;
            transition: transform 1s ease-in-out; 
        }

        /* Subtle pulse effect */
        @keyframes radar-pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .plane-div-icon {
            animation: radar-pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            center: [54.0, -2.5], 
            zoom: 10,
            zoomControl: false,
            dragging: false,
            scrollWheelZoom: false,
            attributionControl: false
        });

        // Dark Matter Map Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        async function setLocalView() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.latitude && data.longitude) {
                    map.setView([data.latitude, data.longitude], 10);
                }
            } catch (e) { console.log("Defaulting view"); }
        }
        setLocalView();

        const API_URL = "https://corsproxy.io/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Flat%2F54.5%2Flon%2F-4.5%2Fdist%2F650";
        let aircraftLayer = L.layerGroup().addTo(map);
        let markers = {}; 

        async function scanRadar() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.ac) {
                    const currentHexes = new Set(data.ac.map(p => p.hex));

                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            const rotation = (plane.track || 0);
                            const planeSvg = `
                                <svg class="plane-icon" style="transform: rotate(${rotation}deg)" viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M21,16L22,13L15,10V3.5A1.5,1.5 0 0,0 13.5,2A1.5,1.5 0 0,0 12,3.5V10L5,13L6,16L12,14V18.5L10,20V22L13.5,21L17,22V20L15,18.5V14L21,16Z" />
                                </svg>`;

                            if (markers[plane.hex]) {
                                // 1. Ensure the smooth transition class is added ONLY for existing markers
                                const el = markers[plane.hex].getElement();
                                if (el && !el.classList.contains('moving-plane')) {
                                    el.classList.add('moving-plane');
                                }

                                // 2. Update Position
                                markers[plane.hex].setLatLng([plane.lat, plane.lon]);
                                
                                // 3. Update Rotation
                                if (el) {
                                    const svg = el.querySelector('svg');
                                    if (svg) svg.style.transform = `rotate(${rotation}deg)`;
                                }
                            } else {
                                // Create new plane WITHOUT the 'moving-plane' class initially
                                // This prevents the "flying in from top-left" bug
                                const marker = L.marker([plane.lat, plane.lon], {
                                    icon: L.divIcon({
                                        html: planeSvg,
                                        className: 'plane-div-icon',
                                        iconSize: [24, 24]
                                    })
                                }).addTo(aircraftLayer);
                                markers[plane.hex] = marker;
                            }
                        }
                    });

                    for (let hex in markers) {
                        if (!currentHexes.has(hex)) {
                            aircraftLayer.removeLayer(markers[hex]);
                            delete markers[hex];
                        }
                    }
                }
            } catch (err) { console.log("Radar Sweep..."); }
        }

        setInterval(scanRadar, 5000);
        scanRadar();
    </script>
</body>
</html>
