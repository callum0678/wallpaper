<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK & Ireland Live Radar - Smooth Local View</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { 
            height: 100%; 
            width: 100%;
            margin: 0; 
            padding: 0; 
            background-color: #020617; 
            overflow: hidden;
        }

        /* Hide all Leaflet UI elements for a clean wallpaper look */
        .leaflet-control-container { display: none !important; }
        
        /* SMOOTH MOVEMENT: This transition makes markers slide instead of jump */
        .leaflet-marker-icon {
            transition: transform 5s linear, left 5s linear, top 5s linear;
        }

        /* The "Radar" Plane Style */
        .plane-icon {
            color: #60a5fa;
            filter: drop-shadow(0 0 4px #60a5fa);
            transform-origin: center;
            /* Rotation is slightly faster to feel responsive */
            transition: transform 1.5s ease-in-out; 
        }

        .land-outline {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map with a neutral start point
        const map = L.map('map', {
            center: [54.0, -2.5], 
            zoom: 6,
            zoomControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            attributionControl: false
        });

        // 2. Local Zoom Logic (IP Geolocation)
        // This detects the general area (City level) without a browser prompt.
        async function autoDetectLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.latitude && data.longitude) {
                    // Zoom level 9 is a good balance for "Local Radar"
                    map.setView([data.latitude, data.longitude], 9);
                }
            } catch (err) {
                console.log("Location detection failed, using default view.");
            }
        }
        autoDetectLocation();

        // 3. Landmass Data
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    filter: (feature) => {
                        const name = feature.properties.NAME;
                        return name === "United Kingdom" || name === "Ireland" || name === "France";
                    },
                    style: {
                        color: '#1e293b',    
                        weight: 2,
                        fillColor: '#0f172a',
                        fillOpacity: 1,
                        className: 'land-outline'
                    }
                }).addTo(map);
            });

        // 4. Radar Tracking Logic
        const API_URL = "https://corsproxy.io/?https%3A%2F%2Fapi.adsb.lol%2Fv2%2Flat%2F54.5%2Flon%2F-4.5%2Fdist%2F650";
        let aircraftLayer = L.layerGroup().addTo(map);
        let markers = {}; 

        async function scanRadar() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) return;
                const data = await response.json();
                
                if (data.ac) {
                    const currentHexes = new Set(data.ac.map(p => p.hex));

                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            const rotation = plane.track || 0;
                            const planeSvg = `
                                <svg class="plane-icon" style="transform: rotate(${rotation}deg)" viewBox="0 0 24 24" width="22" height="22">
                                    <path fill="currentColor" d="M21,16L22,13L15,10V3.5A1.5,1.5 0 0,0 13.5,2A1.5,1.5 0 0,0 12,3.5V10L5,13L6,16L12,14V18.5L10,20V22L13.5,21L17,22V20L15,18.5V14L21,16Z" />
                                </svg>`;

                            if (markers[plane.hex]) {
                                // Transition handles the movement automatically
                                markers[plane.hex].setLatLng([plane.lat, plane.lon]);
                                
                                // Update rotation manually via DOM
                                const iconElement = markers[plane.hex].getElement();
                                if (iconElement) {
                                    const svg = iconElement.querySelector('svg');
                                    if (svg) svg.style.transform = `rotate(${rotation}deg)`;
                                }
                            } else {
                                // Create new marker for new plane
                                const marker = L.marker([plane.lat, plane.lon], {
                                    icon: L.divIcon({
                                        html: planeSvg,
                                        className: 'plane-div-icon',
                                        iconSize: [22, 22]
                                    })
                                }).addTo(aircraftLayer);
                                markers[plane.hex] = marker;
                            }
                        }
                    });

                    // Cleanup planes no longer in range
                    for (let hex in markers) {
                        if (!currentHexes.has(hex)) {
                            aircraftLayer.removeLayer(markers[hex]);
                            delete markers[hex];
                        }
                    }
                }
            } catch (error) {
                console.log("Scanning...");
            }
        }

        // Run Every 5 Seconds (Matches the CSS transition duration)
        scanRadar();
        setInterval(scanRadar, 5000);
    </script>
</body>
</html>
