<!DOCTYPE html>
<html>
<head>
    <title>Live UK & Ireland Airspace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #0f172a; /* Dark sleek background */
        }
        /* Custom map styling to make it look like a wallpaper */
        .leaflet-container { background: #0f172a !important; }
        .leaflet-control-attribution { display: none; }
        
        /* Plane Icon Styling */
        .plane-icon {
            filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.8));
            transition: transform 0.5s linear;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize Map centered on UK/Ireland
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([54.5, -4], 6);

    // 2. Fetch and Draw the precise UK & Ireland Outlines
    // Using a public GeoJSON source for country boundaries
    fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries/GBR.geojson')
        .then(res => res.json())
        .then(data => L.geoJSON(data, { style: { color: '#334155', weight: 2, fillOpacity: 0.1, fillColor: '#1e293b' } }).addTo(map));

    fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries/IRL.geojson')
        .then(res => res.json())
        .then(data => L.geoJSON(data, { style: { color: '#334155', weight: 2, fillOpacity: 0.1, fillColor: '#1e293b' } }).addTo(map));

    // 3. Live Flight Tracking Logic
    let aircraftMarkers = {};

    async function updateFlights() {
        try {
            // OpenSky API Bounding Box for UK/Ireland: [minLat, minLon, maxLat, maxLon]
            const response = await fetch('https://opensky-network.org/api/states/all?lamin=49.0&lomin=-11.0&lamax=61.0&lomax=2.0');
            const data = await response.json();
            
            if (!data.states) return;

            data.states.forEach(flight => {
                const [icao24, callsign, origin, time, lastPos, lon, lat, baro_alt, on_ground, velocity, true_track] = flight;

                if (lat && lon) {
                    const planeSVG = `
                        <svg viewBox="0 0 24 24" width="20" height="20" class="plane-icon" style="transform: rotate(${true_track}deg)">
                            <path fill="#60a5fa" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                        </svg>`;

                    if (aircraftMarkers[icao24]) {
                        aircraftMarkers[icao24].setLatLng([lat, lon]);
                    } else {
                        const icon = L.divIcon({ html: planeSVG, className: '', iconSize: [20, 20] });
                        aircraftMarkers[icao24] = L.marker([lat, lon], { icon: icon }).addTo(map);
                    }
                }
            });
        } catch (err) {
            console.error("Error fetching live flight data:", err);
        }
    }

    // Update every 10 seconds (OpenSky free tier limit)
    setInterval(updateFlights, 10000);
    updateFlights();

</script>
</body>
</html>
