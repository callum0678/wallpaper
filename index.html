<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK/IE Live Airspace</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0b0e14;
            --land-color: #161b22;
            --outline-color: #30363d;
            --plane-color: #58a6ff;
        }

        body, html, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .leaflet-container { background: var(--bg-color) !important; }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* The "Strict" Look */
        .country-outline {
            fill: var(--land-color);
            stroke: var(--outline-color);
            stroke-width: 1.2;
            fill-opacity: 1;
        }

        .plane-glow {
            filter: drop-shadow(0 0 3px var(--plane-color));
            transition: all 1s linear;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize Map
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false
    }).setView([54.3, -4.5], 6);

    // 2. High-Accuracy SVG Paths (Embedded to avoid "Failed to Fetch")
    // These are simplified but accurate outlines of the main landmasses
    const ukBoundaries = [
        [[58.6, -3.0], [58.2, -6.3], [55.3, -6.5], [54.8, -5.5], [54.0, -6.0], [53.4, -4.5], [52.0, -5.2], [50.0, -5.7], [50.8, -1.0], [51.2, 1.4], [52.8, 1.7], [53.5, 0.0], [54.5, -0.5], [56.0, -2.5], [57.5, -1.8], [58.6, -3.0]], // GB
        [[54.6, -5.8], [54.4, -5.4], [54.1, -5.9], [54.6, -5.8]] // NI Small
    ];
    
    const irelandBoundaries = [
        [[55.4, -7.3], [54.2, -10.2], [52.5, -10.5], [51.4, -9.5], [52.2, -6.3], [54.0, -6.0], [55.4, -7.3]]
    ];

    // Drawing the landmasses
    L.polygon(ukBoundaries, {className: 'country-outline'}).addTo(map);
    L.polygon(irelandBoundaries, {className: 'country-outline'}).addTo(map);

    // 3. Live Plane Logic
    let markers = {};

    async function update() {
        try {
            // Using a proxy-free approach for OpenSky
            const res = await fetch('https://opensky-network.org/api/states/all?lamin=49.5&lomin=-11.0&lamax=61.0&lomax=2.5');
            const data = await res.json();
            if (!data.states) return;

            const seen = new Set();
            data.states.forEach(s => {
                const [icao, call, origin, time, last, lon, lat, alt, ground, vel, track] = s;
                if (!lat || !lon || ground) return;
                
                seen.add(icao);
                const pos = [lat, lon];
                const iconHtml = `<svg class="plane-glow" viewBox="0 0 24 24" width="20" height="20" style="transform:rotate(${track}deg)">
                                    <path fill="#58a6ff" d="M21,16L13,11V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V11L2,16V18L10,15.5V21L8,22.5V24L11.5,23L15,24V22.5L13,21V15.5L21,18V16Z" />
                                  </svg>`;

                if (markers[icao]) {
                    markers[icao].setLatLng(pos);
                } else {
                    markers[icao] = L.marker(pos, {
                        icon: L.divIcon({ html: iconHtml, className: '', iconSize: [20, 20] })
                    }).addTo(map);
                }
            });

            // Clean up
            Object.keys(markers).forEach(k => {
                if (!seen.has(k)) { map.removeLayer(markers[k]); delete markers[k]; }
            });
        } catch (e) { console.error("API Limit reached - waiting..."); }
    }

    setInterval(update, 15000);
    update();
</script>
</body>
</html>
